name: nbnd
description: Juego móvil minimalista radial donde la experiencia cambia según la neurodivergencia elegida.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.35.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/spoons/
    - assets/audio/
    - assets/data/
