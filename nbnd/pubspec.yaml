name: nbnd
description: Juego móvil minimalista radial donde la experiencia cambia según la neurodivergencia elegida.
publish_to: "none"
version: 0.2.1+5

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.35.1
  google_mobile_ads:
    path: third_party/google_mobile_ads
  path_provider: ^2.1.6
  # Newer WebView Android releases require API 24.
  webview_flutter: 4.10.0
  webview_flutter_android: 4.10.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/profiles/
    - assets/images/spoons/
    - assets/images/backgrounds/
    - assets/images/gameplay/
    - assets/audio/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/data/
